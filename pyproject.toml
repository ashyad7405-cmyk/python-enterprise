[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-alert-bot"
version = "1.0.0"
description = "An enterprise production-grade cryptocurrency market threshold tracking and notifier daemon."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.1.0",
    "requests>=2.31.0",
]

[project.scripts]
crypto-alert = "cli:main"
